[project]
name = "seed"
version = "0.1.0"
description = "Datos sintéticos de la simulación de inscripción UNIMINUTO (no contiene datos reales)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker~=40.52",
    "pyyaml~=6.0",
    "pymongo~=4.19",
    "redis~=8.1",
    "pydantic~=2.14",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1,<2.5.0",
    "pytest~=9.2",
    "ruff>=0.17.4,<0.17.5",
    "types-pyyaml>=6.0.12.20261103,<6.1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requiere MONGO_URL y REDIS_URL alcanzables; se salta si no lo están",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["seed"]
